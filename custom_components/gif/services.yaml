create_gif:
  name: Create GIF
  description: Create an animated GIF from image files or camera snapshots
  fields:
    images:
      name: Images
      description: List of image file paths (at least two). Mutually exclusive with camera.
      required: false
      example: ["/config/www/gif/frame1.jpg", "/config/www/gif/frame2.jpg"]
      selector:
        text:
          multiple: true
    camera:
      name: Camera
      description: Camera entity to capture snapshots from. Mutually exclusive with images.
      required: false
      example: camera.front_door
      selector:
        entity:
          domain: camera
    count:
      name: Count
      description: Number of snapshots to capture (camera mode)
      required: false
      default: 10
      example: 10
      selector:
        number:
          min: 2
          max: 60
          step: 1
          mode: box
    interval:
      name: Interval
      description: Seconds between snapshots (camera mode)
      required: false
      default: 0.5
      example: 0.5
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          unit_of_measurement: seconds
          mode: box
    fps:
      name: FPS
      description: Frames per second
      required: false
      default: 10
      example: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: box
    output_path:
      name: Output Path
      description: Path to save the GIF
      required: true
      example: "/config/www/gif/output.gif"
      selector:
        text:
    loop:
      name: Loop
      description: Whether the GIF should loop
      required: false
      default: true
      example: true
      selector:
        boolean:
